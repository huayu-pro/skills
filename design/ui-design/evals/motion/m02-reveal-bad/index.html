<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>m02 reveal bad</title>
  <style>
    body { margin: 0; background: #0b0d10; color: #f4efe4; font-family: system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 80px 24px; }
    @keyframes fade-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .reveal { animation: fade-up 800ms cubic-bezier(0,0,.2,1) both; }
  </style>
</head>
<body>
  <main>
    <h1>Every section performs.</h1>
    <p class="reveal">One.</p>
    <p class="reveal">Two.</p>
    <p class="reveal">Three.</p>
  </main>
</body>
</html>
