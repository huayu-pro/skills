<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Canvas — merged 15</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='6' height='6' fill='%23e8b45a'/%3E%3Crect x='13' y='3' width='6' height='6' fill='%23e8b45a'/%3E%3Crect x='23' y='3' width='6' height='6' fill='%23e8b45a'/%3E%3Crect x='3' y='13' width='6' height='6' fill='%23e8b45a'/%3E%3Crect x='13' y='13' width='6' height='6' fill='%23e8b45a'/%3E%3Crect x='23' y='13' width='6' height='6' fill='%23e8b45a'/%3E%3Crect x='3' y='23' width='6' height='6' fill='%23e8b45a'/%3E%3Crect x='13' y='23' width='6' height='6' fill='%23e8b45a'/%3E%3Crect x='23' y='23' width='6' height='6' fill='%23e8b45a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="component.css">
</head>
<body>
  <main class="mr-pixel" data-rf="pixel-canvas">
    <header class="mr-pixel__bar">
      <span class="mr-pixel__mark">MERGED / 15</span>
      <span class="mr-pixel__hint">160 × 120 · 6 colors · no smoothing</span>
    </header>

    <section class="mr-pixel__intro">
      <p class="mr-pixel__eyebrow">F5 · Canvas2D pixel / character</p>
      <h1>Low resolution,<br>high intent.</h1>
      <p class="mr-pixel__lede">先画在 160×120 的离屏 canvas，再用整数倍放大；6 色调色板、关闭平滑、逐个像素落位。不是滤镜，是另一种分辨率。</p>
    </section>

    <section class="mr-pixel__stage">
      <canvas class="mr-pixel__canvas" width="160" height="120" aria-label="像素风景动画"></canvas>
      <div class="mr-pixel__hud">
        <label class="mr-pixel__control">Speed
          <input type="range" min="0" max="2" step="0.1" value="1" data-speed>
        </label>
        <button type="button" class="mr-pixel__pause" data-pause aria-pressed="false">Pause</button>
      </div>
    </section>

    <footer class="mr-pixel__foot">
      <span>integer scale · image-rendering: pixelated</span>
      <output class="mr-pixel__readout" aria-live="off">phase 0.00</output>
    </footer>
  </main>
  <script src="component.js"></script>
</body>
</html>
