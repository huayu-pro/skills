<script>
const DATA = JSON.parse(document.getElementById("demo-data").textContent);
const list = document.getElementById("list");
const stage = document.getElementById("stage");
function decode(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function show(id, push) {
  const d = DATA.items.find((x) => x.id === id) || DATA.items[0];
  stage.srcdoc = decode(d.html);
  document.querySelectorAll("button[data-id]").forEach((b) => b.classList.toggle("on", b.dataset.id === d.id));
  if (push) history.replaceState(null, "", "#" + d.id);
}
DATA.items.forEach((d) => {
  const b = document.createElement("button");
  b.dataset.id = d.id;
  b.innerHTML = d.title + "<small>" + d.id + "</small>";
  b.addEventListener("click", () => show(d.id, true));
  list.appendChild(b);
});
show((location.hash || "").slice(1) || DATA.items[0].id, false);
addEventListener("hashchange", () => show((location.hash || "").slice(1), false));
</script>
