{{texture}}
<div class="band" data-axis style="left:1120px; top:-120px; width:140px; height:960px; background:var(--pop); transform:rotate({{axisDeg}}deg);"></div>
<div class="rect" style="left:0; top:560px; width:640px; height:96px; background:var(--fg);"></div>

<div class="meta fg-fg" data-slot="kicker" style="position:absolute; left:56px; top:56px;">{{slot:kicker}}</div>
<div class="t-h2 fg-fg" data-slot="title" style="position:absolute; left:56px; top:90px; width:1000px;">{{slot:title}}</div>

<div class="meta fg-fg" data-slot="leftLabel" style="position:absolute; left:56px; top:250px;">{{slot:leftLabel}}</div>
<div class="num fg-fg" data-slot="leftNum" style="position:absolute; left:56px; top:280px; font-size:120px;">{{slot:leftNum}}</div>
<div data-slot-block="leftNote"><div class="t-small fg-fg" data-slot="leftNote" style="position:absolute; left:56px; top:440px; width:400px;">{{slot:leftNote}}</div></div>

<div class="rule rule--v" style="left:600px; top:250px; width:2px; height:270px;"></div>

<div class="meta fg-fg" data-slot="rightLabel" style="position:absolute; left:660px; top:250px;">{{slot:rightLabel}}</div>
<div class="num fg-pop" data-slot="rightNum" style="position:absolute; left:660px; top:280px; font-size:200px;">{{slot:rightNum}}</div>
<div data-slot-block="rightNote"><div class="t-small fg-fg" data-slot="rightNote" style="position:absolute; left:660px; top:500px; width:480px;">{{slot:rightNote}}</div></div>

<div class="t-lead fg-bg" data-slot="takeaway" style="position:absolute; left:56px; top:576px; width:560px;">{{slot:takeaway}}</div>
