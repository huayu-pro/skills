<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- 网点化工业剪影：与 gen-textures.mjs 的 PNG 配方同几何（10px 间距 / 半径 3 点阵） -->
  <defs>
    <pattern id="ind-dot" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="3" fill="#000"/>
    </pattern>
    <mask id="ind-mask">
      <rect width="600" height="600" fill="#000"/>
      <g fill="#fff">
        <rect x="30" y="540" width="540" height="60"/>
        <rect x="90" y="250" width="62" height="310"/>
        <rect x="176" y="150" width="40" height="410"/>
        <rect x="240" y="330" width="52" height="230"/>
        <rect x="300" y="430" width="170" height="130"/>
        <rect x="492" y="130" width="16" height="430"/>
        <rect x="372" y="104" width="194" height="20"/>
      </g>
    </mask>
  </defs>
  <rect width="600" height="600" fill="url(#ind-dot)" mask="url(#ind-mask)"/>
</svg>
