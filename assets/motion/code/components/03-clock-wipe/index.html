<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock Wipe — reverse-final</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23e8b45a' stroke-width='2'/%3E%3Cpath d='M16 8v8l6 3' stroke='%23e8b45a' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="component.css">
</head>
<body>
  <main class="rf-clock" data-rf="clock-wipe">
    <header class="rf-clock__bar">
      <span class="rf-clock__mark">CLOCK / 03</span>
      <nav class="rf-clock__nav" aria-label="主导航">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
      <button type="button" class="rf-clock__theme" aria-label="切换明暗主题" aria-pressed="false">
        <span class="rf-clock__theme-icon" aria-hidden="true">◐</span>
        <span class="rf-clock__theme-text">Dark</span>
      </button>
    </header>

    <section class="rf-clock__stage" aria-label="可拖时钟">
      <div class="rf-clock__field" aria-hidden="true"></div>
      <div class="rf-clock__dial" role="group" aria-label="拖拽指针调整时间">
        <div class="rf-clock__ticks" aria-hidden="true"></div>
        <div class="rf-clock__hand rf-clock__hand--hour" aria-hidden="true"></div>
        <div class="rf-clock__hand rf-clock__hand--min" aria-hidden="true"></div>
        <div class="rf-clock__hand rf-clock__hand--sec" aria-hidden="true"></div>
        <div class="rf-clock__pin" aria-hidden="true"></div>
        <div class="rf-clock__readout">
          <span class="rf-clock__time">00:00</span>
          <span class="rf-clock__date">01 JAN 2026</span>
        </div>
      </div>
      <p class="rf-clock__hint">拖拽指针 · 滚轮抬起面板 · ↑↓ 调时间 · 空格换主题</p>
    </section>

    <section class="rf-clock__sheet" aria-label="项目面板">
      <div class="rf-clock__sheet-head">
        <span>Selected work</span>
        <span class="rf-clock__lift">滚轮抬起</span>
      </div>
      <div class="rf-clock__list">
        <article class="rf-clock__item"><span class="rf-clock__item-no">01</span><h2>Melbourne Day</h2><p>Media player / 2026</p></article>
        <article class="rf-clock__item"><span class="rf-clock__item-no">02</span><h2>Led by Arthur</h2><p>Identity / 2025</p></article>
        <article class="rf-clock__item"><span class="rf-clock__item-no">03</span><h2>Three services</h2><p>Brand / Product / Site</p></article>
      </div>
    </section>

    <div class="rf-clock__wipe" aria-hidden="true"></div>
  </main>
  <script src="component.js"></script>
</body>
</html>
