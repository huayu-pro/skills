<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Gallery — reverse-final</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230a0b0d' stroke='%23e8b45a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="component.css">
</head>
<body>
  <main class="rf-orbit" data-rf="orbit-gallery">
    <header class="rf-orbit__bar">
      <span class="rf-orbit__mark">ORBIT / 01</span>
      <nav class="rf-orbit__nav" aria-label="主导航">
        <a href="#work">Work</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
      <span class="rf-orbit__count" aria-live="polite">01 / 06</span>
    </header>

    <section class="rf-orbit__stage" aria-label="轨道画廊">
      <div class="rf-orbit__core" aria-hidden="true">
        <span>ORBIT</span>
        <small>six projects</small>
      </div>
      <div class="rf-orbit__cards" role="list"></div>
      <p class="rf-orbit__hint">滚轮 / 拖拽 / ← → 旋转 · 点击进入</p>
      <div class="rf-orbit__controls">
        <button type="button" data-prev aria-label="上一个项目">←</button>
        <button type="button" data-next aria-label="下一个项目">→</button>
      </div>
    </section>

    <footer class="rf-orbit__strip">
      <div class="rf-orbit__thumbs" role="list" aria-label="项目缩略图"></div>
      <p>Orbit Gallery 把六个 carousel / gallery 结构合成一个轨道舞台。深度同时改大小、模糊、亮度与叠放。</p>
    </footer>

    <dialog class="rf-orbit__detail" aria-label="项目详情">
      <button type="button" class="rf-orbit__close" aria-label="关闭详情">×</button>
      <div class="rf-orbit__detail-art" aria-hidden="true"></div>
      <div class="rf-orbit__detail-copy">
        <p class="rf-orbit__eyebrow"></p>
        <h2></h2>
        <p class="rf-orbit__desc"></p>
        <dl>
          <div><dt>Year</dt><dd class="rf-orbit__year"></dd></div>
          <div><dt>Role</dt><dd class="rf-orbit__role"></dd></div>
        </dl>
      </div>
    </dialog>
  </main>
  <script src="component.js"></script>
</body>
</html>
